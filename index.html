<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/homesplit-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HomeSplit - shared living expenses, shopping and budget for roommates.">
  <meta name="theme-color" content="#0B5F5A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="homesplit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HomeSplit</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #F6F5FB;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      transition: opacity .35s ease;
    }
    #app-loading img {
      width: 120px; height: 120px;
      animation: hs-pop .95s cubic-bezier(.21,1.4,.36,1) both,
                 hs-pulse 1.6s ease-in-out .95s infinite;
    }
    #app-loading .hs-name {
      margin-top: 18px; font-size: 28px; font-weight: 800; color: #1B1528;
      animation: hs-fade .8s ease .15s both;
    }
    #app-loading .hs-tag {
      margin-top: 4px; font-size: 14px; color: #7A7590;
      animation: hs-fade .8s ease .3s both;
    }
    @keyframes hs-pop {
      0% { transform: scale(.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes hs-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes hs-fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <!-- Animated brand splash, shown while the Flutter engine loads.
       Removed by the script below on Flutter's first frame. -->
  <div id="app-loading">
    <img src="loading_logo.png" alt="HomeSplit logo">
    <div class="hs-name">HomeSplit</div>
    <div class="hs-tag">Shared living, split fairly.</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 380); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
